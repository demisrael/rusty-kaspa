[package]
name = "kaspawallet"
description = "Subcommand-style wallet binary with daemon mode and BIP-32 / multisig signing"
keywords = ["kaspa", "wallet", "cli"]
rust-version.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[lib]
name = "kaspawallet"
crate-type = ["lib"]

[[bin]]
name = "kaspawallet"
path = "src/main.rs"

[dependencies]
argon2.workspace = true
async-trait.workspace = true
blake2b_simd.workspace = true
chacha20poly1305.workspace = true
clap.workspace = true
dirs.workspace = true
faster-hex.workspace = true
fd-lock.workspace = true
hex.workspace = true
kaspa-addresses.workspace = true
kaspa-bip32.workspace = true
kaspa-consensus-core.workspace = true
kaspa-grpc-client.workspace = true
kaspa-rpc-core.workspace = true
kaspa-txscript.workspace = true
num_cpus.workspace = true
prost.workspace = true
secp256k1.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time"] }
tokio-stream.workspace = true
tonic = { workspace = true }
tonic-prost.workspace = true
zeroize.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "net", "time"] }

[lints]
workspace = true
