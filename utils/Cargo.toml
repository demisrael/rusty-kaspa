[package]
name = "kaspa-utils"
description = "Kaspa utilities"
rust-version.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
include.workspace = true
license.workspace = true
repository.workspace = true

[build-dependencies]
duct = "0.13.7"

[dependencies]
arc-swap.workspace = true
async-channel.workspace = true
borsh.workspace = true
cfg-if.workspace = true
event-listener.workspace = true
faster-hex.workspace = true
ipnet.workspace = true
itertools.workspace = true
log.workspace = true
num_cpus.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
serde.workspace = true
sha2.workspace = true
smallvec.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
triggered.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mac_address.workspace = true
rlimit.workspace = true
# `tokio` is only used by `PeerEndpoint::resolve` (gated on the same
# `cfg`), so utils' wasm32 build carries no tokio dep at all and cannot
# inherit any wasm32-incompatible features (`net`, `rt-multi-thread`)
# from the workspace tokio entry. Non-wasm32 builds inherit whatever
# the workspace declares plus the `time` + `net` features actually used
# by the resolver.
tokio = { workspace = true, features = ["time", "net"] }

[dev-dependencies]
bincode.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros", "net", "test-util"] }
criterion.workspace = true
rand.workspace = true

[[bench]]
name = "bench"
harness = false

[features]
semaphore-trace = []

[lints]
workspace = true
